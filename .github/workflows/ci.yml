name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore JellyfinMovix.slnx

      - name: Verify formatting and analyzers
        run: dotnet format JellyfinMovix.slnx --verify-no-changes --severity info --no-restore

      - name: Test
        run: dotnet test JellyfinMovix.slnx --configuration Release --no-restore
